# Every push to dev and main runs the checks. Pushing a version tag publishes:
# the server image for GHCR, and signed Android APKs (one per ABI and a
# universal one) and macOS apps (Apple Silicon and Intel) for a GitHub release.
#
#   v0.2.1-beta.1   pre-release; image :dev and :0.2.1-beta.1
#   v0.2.1          release, from a commit on main; image :latest, :0.2.1, :0.2
#
# The tag's version must match package.json apart from the pre-release part.
# A tag push only starts the publishing run on its branch (dev for a
# pre-release, main for a release) with the tag as input: caches belong to a
# branch, and a run on the tag itself could read none, so it compiled
# everything anew. That run skips the checks when the commit's push to the
# branch already passed them (waiting for it if it is still going).
# The release page comes from scripts/release.mjs: the CHANGELOG.md entry,
# the commits since the previous release of the same kind, downloads, and the
# image.
name: Build

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish (vX.Y.Z or vX.Y.Z-beta.N)
        required: true

# A newer push cancels the checks of an older one; publishing runs to the end.
concurrency:
  group: build-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: write
  packages: write
  # Starting the publishing run, and reading the branch run of its commit.
  actions: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/gripread
  NDK_VERSION: 29.0.14206865
  # The commit built: the tag being published, else the pushed commit.
  SOURCE: ${{ inputs.tag || github.sha }}

jobs:
  # A pushed tag hands publishing to a run on its branch.
  dispatch:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) branch=dev ;;
            *) branch=main ;;
          esac
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f tag="$GITHUB_REF_NAME"
          echo "Publishing $GITHUB_REF_NAME runs on $branch."

  version:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      publish: ${{ steps.version.outputs.publish }}
      platforms: ${{ steps.version.outputs.platforms }}
      checked: ${{ steps.checked.outputs.checked }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
      - id: version
        env:
          # Set the repository variable ARM64_IMAGE=true once arm runners are free (a public repository).
          ARM64: ${{ vars.ARM64_IMAGE }}
          TAG: ${{ inputs.tag }}
        run: |
          base=$(node -p "require('./package.json').version")
          if [ -z "$TAG" ]; then
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            version=${TAG#v}
            if [ "${version%%-*}" != "$base" ]; then
              echo "::error::tag $TAG does not match package.json version $base"
              exit 1
            fi
            if [ "$version" = "$base" ]; then
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor HEAD origin/main; then
                echo "::error::release tag $TAG must point at a commit on main"
                exit 1
              fi
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$ARM64" = true ]; then
            echo 'platforms=[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=[{"platform":"linux/amd64","runner":"ubuntu-latest"}]' >> "$GITHUB_OUTPUT"
          fi
      - id: checked
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # The Build runs of this commit pushed to dev or main.
          query="repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&per_page=50"
          filter='[.workflow_runs[] | select(.name == "Build" and (.head_branch == "dev" or .head_branch == "main"))]'
          # A tag is usually pushed together with its branch, so the branch's
          # run may not exist yet: when the commit is the tip of dev or main,
          # one is coming and is waited for.
          git fetch --quiet origin dev main || true
          expected=false
          for branch in dev main; do
            if [ "$(git rev-parse -q --verify "origin/$branch" || true)" = "$sha" ]; then
              expected=true
            fi
          done
          checked=false
          # Up to 30 minutes for the branch run to appear and finish.
          for attempt in $(seq 1 60); do
            runs=$(gh api "$query" --jq "$filter")
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              checked=true
              break
            fi
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$pending" -eq 0 ] && { [ "$expected" = false ] || [ "$(jq length <<<"$runs")" -gt 0 ]; }; then
              # No run to wait for, or the branch run ended without passing.
              break
            fi
            sleep 30
          done
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          if [ "$checked" = true ]; then
            echo "This commit passed the checks on its branch; they are not run again."
          fi

  check:
    needs: version
    if: needs.version.outputs.checked != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - name: Desktop shell libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    needs: [version, check]
    if: ${{ !cancelled() && needs.version.outputs.publish == 'true' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.version.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      # Image names must be lowercase; the owner name may not be.
      - name: Lowercase the image name
        run: echo "IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GRIPREAD_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: [version, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ "$RELEASE" = true ]; then
            tags="-t $image:latest -t $image:$VERSION -t $image:${VERSION%.*}"
          else
            tags="-t $image:dev -t $image:$VERSION"
          fi
          docker buildx imagetools create $tags $(printf "$image@sha256:%s " *)

  apk:
    needs: [version, check]
    if: ${{ !cancelled() && needs.version.outputs.publish == 'true' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Version
        run: node scripts/version.mjs stamp "${{ needs.version.outputs.version }}"
      # One Rust build for all four ABIs, packaged twice: the universal APK,
      # then one APK per ABI (each with its own versionCode, see build.gradle.kts).
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/android.mjs pnpm tauri android build --apk --target aarch64 armv7 i686 x86_64
          node scripts/android.mjs pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 i686 x86_64
      - name: Name the APKs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          apks=src-tauri/gen/android/app/build/outputs/apk
          for pair in universal:universal arm64:arm64-v8a arm:armeabi-v7a x86:x86 x86_64:x86_64; do
            flavor=${pair%%:*}
            cp "$apks/$flavor/release/app-$flavor-release.apk" "out/GripRead-$VERSION-Android-${pair#*:}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: out/*
          retention-days: 7

  desktop:
    needs: [version, check]
    if: ${{ !cancelled() && needs.version.outputs.publish == 'true' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    # Both architectures build on Apple Silicon runners; Intel is cross-compiled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Version
        run: node scripts/version.mjs stamp "${{ needs.version.outputs.version }}"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets"
            exit 1
          fi
          pnpm tauri build --target ${{ matrix.target }}
      - name: Name the files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bundle=target/${{ matrix.target }}/release/bundle
          case "${{ matrix.arch }}" in arm64) label=AppleSilicon ;; *) label=Intel ;; esac
          updater=updater-macos-${{ matrix.arch }}.app.tar.gz
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/GripRead-$VERSION-macOS-$label.dmg"
          cp "$bundle"/macos/*.app.tar.gz "out/$updater"
          cp "$bundle"/macos/*.app.tar.gz.sig "out/$updater.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos-${{ matrix.arch }}
          path: out/*
          retention-days: 7

  release:
    needs: [version, apk, desktop, manifest]
    if: ${{ !cancelled() && needs.apk.result == 'success' && needs.desktop.result == 'success' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The full history and tags, for the commits since the previous release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: out
      - name: Updater manifest and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release.mjs updater "$VERSION" out
          (cd out && sha256sum * > SHA256SUMS)
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release.mjs notes "$VERSION" out > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          flags=()
          [ "$RELEASE" = true ] || flags=(--prerelease)
          # Installers by platform first, then checksums and updater files.
          mapfile -t files < <(node scripts/release.mjs order "$VERSION" out | sed 's|^|out/|')
          gh release create "v$VERSION" "${files[@]}" --verify-tag --title "手不释卷 v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          if [ "$RELEASE" != true ]; then
            # Keep the five newest pre-releases.
            gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
              while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          fi
