# Checks every push to dev and main, then publishes the server image to
# GHCR and a signed APK as a GitHub release:
#
#   dev   image :dev and :<version>-dev.<run>, APK pre-release v<version>-dev.<run>
#   main  image :latest, :<version>, :<major>.<minor>, APK release v<version>
#
# The version comes from package.json (scripts/version.mjs); a main build
# needs a version whose v<version> tag does not exist yet.
name: Build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/gripread
  NDK_VERSION: 29.0.14206865

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      platforms: ${{ steps.version.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          # Set the repository variable ARM64_IMAGE=true once arm runners are free (a public repository).
          ARM64: ${{ vars.ARM64_IMAGE }}
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" = main ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null; then
              echo "::error::v$base is already released; raise the version (pnpm version:set) before merging into main"
              exit 1
            fi
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$ARM64" = true ]; then
            echo 'platforms=[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=[{"platform":"linux/amd64","runner":"ubuntu-latest"}]' >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - name: Desktop shell libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    needs: [version, check]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.version.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the owner name may not be.
      - name: Lowercase the image name
        run: echo "IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GRIPREAD_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ "$RELEASE" = true ]; then
            tags="-t $image:latest -t $image:$VERSION -t $image:${VERSION%.*}"
          else
            tags="-t $image:dev -t $image:$VERSION"
          fi
          docker buildx imagetools create $tags $(printf "$image@sha256:%s " *)

  apk:
    needs: [version, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Version
        run: node scripts/version.mjs stamp "${{ needs.version.outputs.version }}" "$GITHUB_RUN_NUMBER"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android.mjs pnpm tauri android build --apk --target aarch64
      - name: Name the APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          test -n "$apk"
          mkdir -p out
          cp "$apk" "out/gripread-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 7

  release:
    needs: [version, apk, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          notes="服务器镜像：\`docker pull $image:$VERSION\`"
          if [ "$RELEASE" = true ]; then
            gh release create "v$VERSION" out/*.apk --target "$GITHUB_SHA" --title "手不释卷 $VERSION" --notes "$notes"
          else
            gh release create "v$VERSION" out/*.apk --target "$GITHUB_SHA" --title "手不释卷 $VERSION" --notes "$notes" --prerelease
            # Keep the five newest pre-releases.
            gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
              while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          fi
