[package]
name = "gripread"
version.workspace = true
description = "A local-first novel reader"
authors = ["GripRead contributors"]
edition = "2021"
rust-version = "1.87"
default-run = "gripread"

[lib]
name = "gripread_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "gripread"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = []
native-test = [
    "gripread-core/native-test",
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
]

[dependencies]
gripread-core = { path = "../crates/core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
