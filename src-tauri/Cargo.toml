[package]
name = "gripread"
version = "0.1.0"
description = "A local-first novel reader"
authors = ["GripRead contributors"]
edition = "2021"
rust-version = "1.78"
default-run = "gripread"

[lib]
name = "gripread_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "gripread"
path = "src/main.rs"

[[bin]]
name = "generate-types"
path = "src/bin/generate_types.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = []
native-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
fs2 = "0.4.3"
chardetng = "0.1.17"
encoding_rs = "0.8.35"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
regex = "1.13.1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
ts-rs = "12.0.1"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
fancy-regex = "0.19.2"

# Debug builds are installed on devices for acceptance. Optimize dependencies
# (decoding, encoding detection, hashing, regex, SQLite) so imports and reads
# are representative; GripRead's own code stays quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
