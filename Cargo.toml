[workspace]
members = ["crates/core", "crates/server", "src-tauri"]
resolver = "2"

# The version is set with `pnpm version:set` (scripts/version.mjs) together
# with package.json.
[workspace.package]
version = "0.2.2"
license = "GPL-3.0-only"

# Debug builds are installed on devices for acceptance. Optimize dependencies
# (decoding, encoding detection, hashing, regex, SQLite) so imports and reads
# are representative; GripRead's own code stays quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
